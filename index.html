<!DOCTYPE html>
<html lang="ru">
<head>

    <title>ArtFlow Pro - 150+ Brushes PWA</title>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="app-manifest">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            height: 100%; 
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: #fff; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-user-select: none; 
            user-select: none;
            touch-action: none;
        }
        
        /* Header */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        
        .logo {
            font-weight: 700;
            font-size: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-controls {
            display: flex;
            gap: 12px;
        }
        
        /* Canvas */
        #canvas {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 120px;
            background: #fff;
            touch-action: none;
            cursor: crosshair;
        }
        
        /* Bottom Panel */
        #bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            gap: 12px;
        }
        
        /* Brush Controls */
        .brush-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 12px;
        }
        
        /* Tools */
        .tools-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .main-tools {
            display: flex;
            gap: 8px;
        }
        
        .utility-tools {
            display: flex;
            gap: 8px;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn:hover { 
            background: rgba(255,255,255,0.15); 
        }
        
        .btn:active { 
            transform: scale(0.95); 
        }
        
        .btn.active { 
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4); 
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Sliders */
        input[type="range"] {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
        }
        
        /* Panels */
        #brushes-panel {
            position: fixed;
            left: -320px;
            top: 60px;
            bottom: 120px;
            width: 320px;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(30px);
            border-right: 1px solid #333;
            transition: left 0.3s ease;
            overflow-y: auto;
            padding: 16px;
            z-index: 90;
        }
        
        #brushes-panel.open {
            left: 0;
        }
        
        #color-picker {
            position: fixed;
            right: -280px;
            top: 60px;
            bottom: 120px;
            width: 280px;
            background: rgba(20, 20, 20, 0.98);
            backdrop-filter: blur(30px);
            border-left: 1px solid #333;
            transition: right 0.3s ease;
            padding: 16px;
            z-index: 90;
        }
        
        #color-picker.open {
            right: 0;
        }
        
        .brushes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        
        .brush-thumb {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .brush-thumb:hover { 
            border-color: #4ecdc4; 
        }
        
        .brush-thumb.active { 
            border-color: #ff6b6b; 
            box-shadow: 0 0 0 2px #ff6b6b; 
        }
        
        .brush-preview {
            width: 80%;
            height: 80%;
            border-radius: 4px;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        
        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .color-swatch:hover { 
            transform: scale(1.1); 
        }
        
        .color-swatch.active { 
            border-color: #fff; 
            box-shadow: 0 0 0 2px #fff; 
        }
        
        .category-title {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin: 20px 0 8px 0;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 80;
            display: none;
        }
        
        .overlay.active {
            display: block;
        }
        
        .value-display {
            min-width: 40px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .search-box::placeholder {
            color: #888;
        }
    </style>
</head>

        // ==================== ДОПОЛНИТЕЛЬНЫЕ ГЕНЕРАТОРЫ ШТАМПОВ ====================
        
        // Каллиграфические кисти
        const calligraphyThin = (r) => {
            const c = document.createElement('canvas');
            c.width = r * 2;
            c.height = r * 2;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.save();
            ctx.translate(r, r);
            ctx.rotate(Math.PI / 4);
            ctx.fillRect(-r*0.1, -r, r*0.2, r*2);
            ctx.restore();
            return c;
        };

        const calligraphyMedium = (r) => {
            const c = document.createElement('canvas');
            c.width = r * 2;
            c.height = r * 2;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.save();
            ctx.translate(r, r);
            ctx.rotate(Math.PI / 6);
            ctx.fillRect(-r*0.15, -r, r*0.3, r*2);
            ctx.restore();
            return c;
        };

        const calligraphyThick = (r) => {
            const c = document.createElement('canvas');
            c.width = r * 2;
            c.height = r * 2;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.save();
            ctx.translate(r, r);
            ctx.rotate(Math.PI / 8);
            ctx.fillRect(-r*0.2, -r, r*0.4, r*2);
            ctx.restore();
            return c;
        };

        // Аэрозольные кисти
        const sprayThin = (r) => {
            const c = document.createElement('canvas');
            c.width = c.height = r * 2;
            const ctx = c.getContext('2d');
            const imgData = ctx.createImageData(r*2, r*2);
            const data = imgData.data;
            
            for(let i = 0; i < data.length; i += 4) {
                const x = (i/4) % (r*2);
                const y = Math.floor((i/4) / (r*2));
                const dist = Math.hypot(x - r, y - r);
                
                if(dist < r) {
                    const density = 1 - dist/r;
                    const spray = Math.random() < density * 0.3 ? 1 : 0;
                    const alpha = spray * (0.3 + Math.random() * 0.4) * 255;
                    data[i+3] = alpha;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return c;
        };

        const sprayMedium = (r) => {
            const c = document.createElement('canvas');
            c.width = c.height = r * 2;
            const ctx = c.getContext('2d');
            const imgData = ctx.createImageData(r*2, r*2);
            const data = imgData.data;
            
            for(let i = 0; i < data.length; i += 4) {
                const x = (i/4) % (r*2);
                const y = Math.floor((i/4) / (r*2));
                const dist = Math.hypot(x - r, y - r);
                
                if(dist < r) {
                    const density = 1 - dist/r;
                    const spray = Math.random() < density * 0.5 ? 1 : 0;
                    const alpha = spray * (0.5 + Math.random() * 0.3) * 255;
                    data[i+3] = alpha;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return c;
        };

        // Дополнительные текстуры
        const textureWater = (r) => {
            const c = stampMap.softRound(r);
            const ctx = c.getContext('2d');
            ctx.globalCompositeOperation = 'overlay';
            for(let i = 0; i < 5; i++) {
                const circles = 3;
                for(let j = 0; j < circles; j++) {
                    const radius = r * (0.3 + j * 0.2);
                    ctx.strokeStyle = `rgba(255,255,255,${0.1 + Math.random() * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(r, r, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            return c;
        };

        const textureLightning = (r) => {
            const c = document.createElement('canvas');
            c.width = c.height = r * 2;
            const ctx = c.getContext('2d');
            
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            
            for(let i = 0; i < 3; i++) {
                const startX = Math.random() * r * 2;
                const startY = r * 2;
                let x = startX;
                let y = startY;
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                
                while(y > 0) {
                    x += (Math.random() - 0.5) * 15;
                    y -= Math.random() * 10 + 5;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            return c;
        };

        Object.assign(stampMap, {

            sprayMedium,
            textureWater,

            calligraphyFast: calligraphyThin,
            calligraphyElegant: calligraphyMedium,
            calligraphyExpressive: calligraphyThick,
            
            sprayThick: sprayMedium,
            sprayGraffiti: sprayMedium,
            sprayBlurred: sprayThin,
            sprayDotted: sprayThin,
            sprayDense: sprayMedium,
            sprayLight: sprayThin,
            sprayNeon: stampMap.glowNeon,
            sprayMetallic: sprayMedium,
            sprayGlossy: sprayMedium,
            sprayMatte: sprayThin,
            sprayFluorescent: sprayMedium,
            sprayTransparent: sprayThin,
            sprayUltraThin: sprayThin,
            
            textureSand: stampMap.textureStone,
            textureMetal: stampMap.textureStone,
            textureGlass: textureWater,
            textureLeather: stampMap.textureFur,
            textureFabric: stampMap.textureFur,
            texturePaper: stampMap.textureWood,
            textureBrick: stampMap.textureStone,
            textureMarble: stampMap.textureStone,
            textureClouds: stampMap.textureSmoke,
            textureStars: stampMap.sparkle,
            textureSnow: stampMap.sparkle,
            textureIce: textureWater,
            textureLava: stampMap.textureFire,
            textureRust: stampMap.textureStone
        });

        // ==================== ОБНОВЛЕННЫЙ КЛАСС ПРИЛОЖЕНИЯ ====================
        class ArtFlowApp {
            constructor() {
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.setupEventListeners();
                this.initState();
                this.resizeCanvas();
                this.populateBrushes();
                this.populateColors();
                this.setupPWA();
            }

            initState() {
                this.currentBrush = {...Brushes[0]};
                this.currentColor = '#5B8FF9';
                this.isDrawing = false;
                this.lastPoint = null;
                this.isErasing = false;
                this.isSmudging = false;
                this.isBlending = false;
                
                this.history = [];
                this.historyIndex = -1;
                this.maxHistory = 20;
                
                this.tempCanvas = document.createElement('canvas');
                this.tempCtx = this.tempCanvas.getContext('2d');
                
                this.textureCache = new Map();
                
                this.saveState();
            }

            setupEventListeners() {
                window.addEventListener('resize', () => this.resizeCanvas());
                
                this.canvas.addEventListener('pointerdown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('pointermove', (e) => this.draw(e));
                this.canvas.addEventListener('pointerup', () => this.stopDrawing());
                this.canvas.addEventListener('pointerleave', () => this.stopDrawing());
                
                document.getElementById('btn-brushes').addEventListener('click', () => this.togglePanel('brushes'));
                document.getElementById('btn-colors').addEventListener('click', () => this.togglePanel('colors'));
                document.getElementById('btn-eraser').addEventListener('click', () => this.toggleEraser());
                document.getElementById('btn-smudge').addEventListener('click', () => this.toggleSmudge());
                document.getElementById('btn-blend').addEventListener('click', () => this.toggleBlend());
                document.getElementById('btn-undo').addEventListener('click', () => this.undo());
                document.getElementById('btn-redo').addEventListener('click', () => this.redo());
                document.getElementById('btn-clear').addEventListener('click', () => this.clearCanvas());
                document.getElementById('btn-save').addEventListener('click', () => this.saveImage());
                document.getElementById('overlay').addEventListener('click', () => this.closePanels());
                
                document.getElementById('brush-size').addEventListener('input', (e) => this.updateBrushSize(e));
                document.getElementById('brush-opacity').addEventListener('input', (e) => this.updateBrushOpacity(e));
                document.getElementById('brush-flow').addEventListener('input', (e) => this.updateBrushFlow(e));
                
                // Поиск кистей
                document.getElementById('brush-search').addEventListener('input', (e) => this.searchBrushes(e.target.value));
            }

            setupPWA() {
                const manifest = {
                    "name": "ArtFlow Pro - 150+ Brushes",
                    "short_name": "ArtFlow Pro",
                    "description": "Professional drawing app with 150+ brushes",
                    "start_url": "./",
                    "display": "standalone",
                    "background_color": "#1a1a1a",
                    "theme_color": "#1a1a1a",
                    "orientation": "landscape",
                    "icons": [
                        {
                            "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=",
                            "sizes": "192x192",
                            "type": "image/png"
                        }
                    ]
                };
                
                const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                document.getElementById('app-manifest').href = URL.createObjectURL(manifestBlob);
                
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('data:application/javascript;base64,' + btoa(`
                        self.addEventListener('install', (e) => {
                            self.skipWaiting();
                        });
                        self.addEventListener('fetch', (e) => {
                            e.respondWith(fetch(e.request));
                        });
                    `));
                }
            }

            searchBrushes(query) {
                const grid = document.getElementById('brushes-grid');
                const brushes = grid.querySelectorAll('.brush-thumb');
                const searchTerm = query.toLowerCase().trim();
                
                brushes.forEach(thumb => {
                    const brushName = thumb.getAttribute('data-name').toLowerCase();
                    if (brushName.includes(searchTerm)) {
                        thumb.style.display = 'block';
                    } else {
                        thumb.style.display = 'none';
                    }
                });
            }

            populateBrushes() {
                const grid = document.getElementById('brushes-grid');
                grid.innerHTML = '';
                
                const categories = {};
                Brushes.forEach(brush => {
                    if (!categories[brush.category]) {
                        categories[brush.category] = [];
                    }
                    categories[brush.category].push(brush);
                });
                
                Object.keys(categories).forEach(category => {
                    const title = document.createElement('div');
                    title.className = 'category-title';
                    title.textContent = `${category} (${categories[category].length})`;
                    grid.appendChild(title);
                    
                    categories[category].forEach((brush, index) => {
                        const thumb = document.createElement('div');
                        thumb.className = 'brush-thumb';
                        thumb.setAttribute('data-name', brush.name);
                        thumb.innerHTML = `<div class="brush-preview" style="background:${brush.color};opacity:${brush.opacity}"></div>`;
                        
                        thumb.addEventListener('click', () => {
                            this.selectBrush(brush);
                            document.querySelectorAll('.brush-thumb').forEach(t => t.classList.remove('active'));
                            thumb.classList.add('active');
                        });
                        
                        if (index === 0 && category === 'Базовые') {
                            thumb.classList.add('active');
                        }
                        
                        grid.appendChild(thumb);
                    });
                });
            }

            // Остальные методы класса остаются такими же как в предыдущей версии
            resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const rect = this.canvas.getBoundingClientRect();
                
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.tempCanvas.width = rect.width * dpr;
                this.tempCanvas.height = rect.height * dpr;
                
                this.ctx.scale(dpr, dpr);
                this.tempCtx.scale(dpr, dpr);
                
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
                
                if (this.history.length > 0) {
                    this.restoreFromHistory();
                }
            }

            startDrawing(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                
                this.isDrawing = true;
                this.lastPoint = this.getPointerPos(e);
                
                if (!this.isSmudging && !this.isBlending) {
                    this.saveState();
                }
                
                this.draw(e);
            }

            draw(e) {
                if (!this.isDrawing || !this.lastPoint) return;
                
                const currentPoint = this.getPointerPos(e);
                const pressure = e.pressure || 1;
                
                if (this.isSmudging) {
                    this.smudge(this.lastPoint, currentPoint, pressure);
                } else if (this.isBlending) {
                    this.blend(this.lastPoint, currentPoint, pressure);
                } else if (this.isErasing) {
                    this.erase(this.lastPoint, currentPoint, pressure);
                } else {
                    this.paint(this.lastPoint, currentPoint, pressure);
                }
                
                this.lastPoint = currentPoint;
            }

            stopDrawing() {
                this.isDrawing = false;
                this.lastPoint = null;
            }

            getPointerPos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    pressure: e.pressure || 1
                };
            }

            paint(start, end, pressure) {
                const brush = this.currentBrush;
                const size = brush.size * pressure;
                const opacity = brush.opacity * pressure;
                const spacing = size * brush.spacing;
                
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const distance = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                
                this.ctx.globalCompositeOperation = brush.blend;
                this.ctx.globalAlpha = opacity;
                
                for (let d = 0; d < distance; d += spacing) {
                    const x = start.x + Math.cos(angle) * d + (Math.random() - 0.5) * brush.scatter * size;
                    const y = start.y + Math.sin(angle) * d + (Math.random() - 0.5) * brush.scatter * size;
                    
                    const stamp = this.createColorizedStamp(size, this.currentColor, opacity);
                    this.ctx.drawImage(stamp, x - size, y - size);
                }
            }

            erase(start, end, pressure) {
                const size = this.currentBrush.size * pressure * 0.8;
                const spacing = size * 0.1;
                
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const distance = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                
                this.ctx.globalCompositeOperation = 'destination-out';
                this.ctx.globalAlpha = 0.7;
                
                for (let d = 0; d < distance; d += spacing) {
                    const x = start.x + Math.cos(angle) * d;
                    const y = start.y + Math.sin(angle) * d;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            smudge(start, end, pressure) {
                const size = this.currentBrush.size * pressure * 0.6;
                const spacing = size * 0.2;
                
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const distance = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                
                this.tempCtx.clearRect(0, 0, this.tempCanvas.width, this.tempCanvas.height);
                this.tempCtx.drawImage(this.canvas, 0, 0);
                
                this.ctx.globalCompositeOperation = 'copy';
                this.ctx.globalAlpha = 0.3;
                
                for (let d = 0; d < distance; d += spacing) {
                    const x = start.x + Math.cos(angle) * d;
                    const y = start.y + Math.sin(angle) * d;
                    
                    this.ctx.drawImage(
                        this.tempCanvas,
                        x - size/2, y - size/2, size, size,
                        x - size/2 + 2, y - size/2 + 2, size, size
                    );
                }
            }

            blend(start, end, pressure) {
                const size = this.currentBrush.size * pressure * 0.8;
                const spacing = size * 0.15;
                
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const distance = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx);
                
                this.ctx.globalCompositeOperation = 'soft-light';
                this.ctx.globalAlpha = 0.4;
                
                for (let d = 0; d < distance; d += spacing) {
                    const x = start.x + Math.cos(angle) * d;
                    const y = start.y + Math.sin(angle) * d;
                    
                    const gradient = this.ctx.createRadialGradient(x, y, 0, x, y, size);
                    gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    
                    this.ctx.fillStyle = gradient;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            createColorizedStamp(size, color, opacity) {
                const key = `${size}_${color}_${opacity}_${this.currentBrush.stampFunc}`;
                
                if (this.textureCache.has(key)) {
                    return this.textureCache.get(key);
                }
                
                const stampSize = Math.ceil(size * 2);
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = stampSize;
                const ctx = canvas.getContext('2d');
                
                const baseStamp = stampMap[this.currentBrush.stampFunc](size);
                
                ctx.globalAlpha = opacity;
                ctx.drawImage(baseStamp, 0, 0, stampSize, stampSize);
                ctx.globalCompositeOperation = 'source-in';
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, stampSize, stampSize);
                
                this.textureCache.set(key, canvas);
                
                if (this.textureCache.size > 50) {
                    const firstKey = this.textureCache.keys().next().value;
                    this.textureCache.delete(firstKey);
                }
                
                return canvas;
            }

            saveState() {
                this.canvas.toBlob(blob => {
                    if (this.historyIndex < this.history.length - 1) {
                        this.history = this.history.slice(0, this.historyIndex + 1);
                    }
                    
                    this.history.push(blob);
                    this.historyIndex = this.history.length - 1;
                    
                    if (this.history.length > this.maxHistory) {
                        this.history.shift();
                        this.historyIndex--;
                    }
                    
                    this.updateUndoRedoButtons();
                });
            }

            restoreFromHistory() {
                if (this.historyIndex >= 0 && this.historyIndex < this.history.length) {
                    const img = new Image();
                    img.onload = () => {
                        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                        this.ctx.drawImage(img, 0, 0);
                    };
                    img.src = URL.createObjectURL(this.history[this.historyIndex]);
                }
            }

            undo() {
                if (this.historyIndex > 0) {
                    this.historyIndex--;
                    this.restoreFromHistory();
                    this.updateUndoRedoButtons();
                }
            }

            redo() {
                if (this.historyIndex < this.history.length - 1) {
                    this.historyIndex++;
                    this.restoreFromHistory();
                    this.updateUndoRedoButtons();
                }
            }

            updateUndoRedoButtons() {
                document.getElementById('btn-undo').disabled = this.historyIndex <= 0;
                document.getElementById('btn-redo').disabled = this.historyIndex >= this.history.length - 1;
            }

            clearCanvas() {
                if (confirm('Очистить холст?')) {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.saveState();
                }
            }

            updateBrushSize(e) {
                this.currentBrush.size = parseInt(e.target.value);
                document.getElementById('brush-size-value').textContent = this.currentBrush.size;
            }

            updateBrushOpacity(e) {
                this.currentBrush.opacity = parseFloat(e.target.value);
                document.getElementById('brush-opacity-value').textContent = Math.round(this.currentBrush.opacity * 100) + '%';
            }

            updateBrushFlow(e) {
                const flow = parseFloat(e.target.value);
                this.currentBrush.spacing = flow * 0.3;
                document.getElementById('brush-flow-value').textContent = Math.round(flow * 100) + '%';
            }

            toggleEraser() {
                this.isErasing = !this.isErasing;
                this.isSmudging = false;
                this.isBlending = false;
                
                const btn = document.getElementById('btn-eraser');
                btn.classList.toggle('active', this.isErasing);
                document.getElementById('btn-smudge').classList.remove('active');
                document.getElementById('btn-blend').classList.remove('active');
            }

            toggleSmudge() {
                this.isSmudging = !this.isSmudging;
                this.isErasing = false;
                this.isBlending = false;
                
                const btn = document.getElementById('btn-smudge');
                btn.classList.toggle('active', this.isSmudging);
                document.getElementById('btn-eraser').classList.remove('active');
                document.getElementById('btn-blend').classList.remove('active');
            }

            toggleBlend() {
                this.isBlending = !this.isBlending;
                this.isErasing = false;
                this.isSmudging = false;
                
                const btn = document.getElementById('btn-blend');
                btn.classList.toggle('active', this.isBlending);
                document.getElementById('btn-eraser').classList.remove('active');
                document.getElementById('btn-smudge').classList.remove('active');
            }

            togglePanel(panelName) {
                const brushesPanel = document.getElementById('brushes-panel');
                const colorsPanel = document.getElementById('color-picker');
                const overlay = document.getElementById('overlay');
                
                if (panelName === 'brushes') {
                    brushesPanel.classList.toggle('open');
                    colorsPanel.classList.remove('open');
                } else if (panelName === 'colors') {
                    colorsPanel.classList.toggle('open');
                    brushesPanel.classList.remove('open');
                }
                
                overlay.classList.toggle('active', brushesPanel.classList.contains('open') || colorsPanel.classList.contains('open'));
            }

            closePanels() {
                document.getElementById('brushes-panel').classList.remove('open');
                document.getElementById('color-picker').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            }

            populateColors() {
                const grid = document.getElementById('color-grid');
                const colors = [
                    '#5B8FF9', '#5AD8A6', '#F6BD16', '#E86452', '#945FB9',
                    '#1E9E9E', '#FF9845', '#A32020', '#87D068', '#2C3E50',
                    '#8D4BBB', '#F4E925', '#BFBFBF', '#E50580', '#FFFFFF',
                    '#000000', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
                    '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE'
                ];
                
                colors.forEach(color => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.background = color;
                    
                    swatch.addEventListener('click', () => {
                        this.selectColor(color);
                        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                        swatch.classList.add('active');
                    });
                    
                    if (color === '#5B8FF9') {
                        swatch.classList.add('active');
                    }
                    
                    grid.appendChild(swatch);
                });
            }

            selectBrush(brush) {
                this.currentBrush = {...brush};
                document.getElementById('brush-size').value = brush.size;
                document.getElementById('brush-opacity').value = brush.opacity;
                document.getElementById('brush-size-value').textContent = brush.size;
                document.getElementById('brush-opacity-value').textContent = Math.round(brush.opacity * 100) + '%';
                this.closePanels();
            }

            selectColor(color) {
                this.currentColor = color;
                this.closePanels();
            }

            async saveImage() {
                try {
                    const blob = await new Promise(resolve => this.canvas.toBlob(resolve, 'image/png', 1.0));
                    const file = new File([blob], `artflow-${Date.now()}.png`, { type: 'image/png' });
                    
                    if (navigator.share && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: 'ArtFlow Pro Drawing',
                            text: 'Создано в ArtFlow Pro'
                        });
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `artflow-${Date.now()}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                } catch (error) {
                    console.error('Error saving image:', error);
                    alert('Ошибка при сохранении изображения');
                }
            }
        }

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ArtFlowApp();
        });
    </script>
